<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runa — Hearthweave Altar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-light: #B9958A;
      --ink-light: #2d1916;
      --bg-dark: #05070d;
      --ink-dark: #f5eadf;
      --accent: #2d7a5f;
      --accent-2: #f6c453;
      --glass: rgba(255,255,255,.14);
      --ring: rgba(255,255,255,.24);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 10%, rgba(246,196,83,.20), transparent 28rem),
        radial-gradient(circle at 82% 88%, rgba(45,122,95,.24), transparent 30rem),
        var(--bg-light);
      color: var(--ink-light);
      font-family: 'Cormorant Garamond', Georgia, serif;
      transition: background .45s ease, color .45s ease;
    }
    body.dark {
      background:
        radial-gradient(circle at 18% 10%, rgba(246,196,83,.12), transparent 28rem),
        radial-gradient(circle at 82% 88%, rgba(45,122,95,.20), transparent 30rem),
        var(--bg-dark);
      color: var(--ink-dark);
      --glass: rgba(5,8,16,.62);
      --ring: rgba(255,255,255,.16);
    }
    canvas#stars, canvas#sigil { display: block; }
    #stars { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .42; mix-blend-mode: screen; }
    body:not(.dark) #stars { opacity: .16; mix-blend-mode: multiply; }
    .topbar {
      position: fixed; z-index: 20; left: 1rem; right: 1rem; top: 1rem;
      display: flex; align-items: center; justify-content: space-between; gap: .75rem;
      pointer-events: none;
    }
    .topbar a, .topbar button { pointer-events: auto; }
    .pill, button {
      border: 1px solid rgba(45,25,22,.22);
      background: rgba(255,255,255,.18);
      color: inherit;
      border-radius: 999px;
      padding: .55rem .85rem;
      font: 700 .62rem/1 'Cinzel', serif;
      letter-spacing: .16em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(45,25,22,.12);
    }
    body.dark .pill, body.dark button { border-color: rgba(246,196,83,.22); background: rgba(0,0,0,.26); }
    .wrap { position: relative; z-index: 2; width: min(1120px, 92vw); margin: 0 auto; padding: 6rem 0 3rem; }
    header.hero { text-align: center; margin: 0 auto 2rem; max-width: 760px; }
    .eyebrow {
      font: 700 .66rem/1 'Cinzel', serif;
      letter-spacing: .45em;
      text-transform: uppercase;
      opacity: .68;
      margin: 0 0 .9rem;
    }
    h1 {
      margin: 0;
      font: 600 clamp(2.2rem, 7vw, 5.7rem)/.92 'Cinzel', serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-shadow: 0 10px 38px rgba(45,25,22,.18);
    }
    body.dark h1 { text-shadow: 0 0 32px rgba(246,196,83,.14), 0 0 70px rgba(45,122,95,.18); }
    .sub { font-style: italic; font-size: clamp(1.12rem, 2vw, 1.45rem); opacity: .76; margin: 1rem auto 0; line-height: 1.45; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .85rem; margin: 2.2rem 0; }
    .card {
      min-height: 170px;
      padding: 1.15rem;
      border-radius: 26px;
      background: var(--glass);
      border: 1px solid var(--ring);
      box-shadow: 0 24px 80px rgba(35,15,10,.13), inset 0 1px 0 rgba(255,255,255,.22);
      backdrop-filter: blur(18px);
      display: grid;
      align-content: space-between;
      cursor: pointer;
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }
    .card:hover, .card.active { transform: translateY(-4px); border-color: rgba(var(--rgb),.68); box-shadow: 0 24px 90px rgba(var(--rgb),.25), inset 0 1px 0 rgba(255,255,255,.22); }
    .sigil-dot { width: 54px; height: 54px; border-radius: 50%; border: 1px solid rgba(var(--rgb),.48); background: radial-gradient(circle, rgba(var(--rgb),.34), transparent 68%); box-shadow: 0 0 22px rgba(var(--rgb),.25); }
    .card h2 { margin: .8rem 0 .2rem; font: 700 1rem/1.1 'Cinzel', serif; letter-spacing: .1em; color: rgb(var(--rgb)); }
    .card p { margin: 0; opacity: .76; line-height: 1.45; font-size: .98rem; }
    .altar {
      display: grid;
      grid-template-columns: minmax(280px, 420px) minmax(280px, 1fr);
      gap: 1.2rem;
      align-items: stretch;
      margin-top: 1.5rem;
    }
    .sigil-panel, .work-panel {
      border-radius: 32px;
      border: 1px solid var(--ring);
      background: var(--glass);
      backdrop-filter: blur(18px);
      box-shadow: 0 30px 100px rgba(35,15,10,.14), inset 0 1px 0 rgba(255,255,255,.18);
      padding: clamp(1rem, 3vw, 1.4rem);
    }
    .sigil-frame {
      position: relative;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle, rgba(var(--realm-rgb),.18), rgba(0,0,0,.04) 58%, transparent 70%);
      border: 1px solid rgba(var(--realm-rgb),.32);
      box-shadow: 0 0 48px rgba(var(--realm-rgb),.19), inset 0 0 45px rgba(var(--realm-rgb),.12);
      overflow: hidden;
    }
    .sigil-frame:before, .sigil-frame:after {
      content: ''; position: absolute; inset: 8%; border-radius: 50%; border: 1px dashed rgba(var(--realm-rgb),.30);
      animation: spin 42s linear infinite;
    }
    .sigil-frame:after { inset: 16%; animation-duration: 29s; animation-direction: reverse; opacity: .72; }
    body[data-realm="enochian"] .sigil-frame {
      background: radial-gradient(circle, rgba(var(--realm-rgb),.045), rgba(0,0,0,.025) 58%, transparent 72%);
      border-color: rgba(var(--realm-rgb),.22);
      box-shadow: 0 16px 42px rgba(35,15,10,.12), inset 0 0 24px rgba(var(--realm-rgb),.045);
    }
    body[data-realm="enochian"] .sigil-frame:before,
    body[data-realm="enochian"] .sigil-frame:after {
      border-color: rgba(var(--realm-rgb),.14);
      opacity: .46;
    }
    body.dark[data-realm="enochian"] .sigil-frame {
      background: radial-gradient(circle, rgba(var(--realm-rgb),.035), rgba(1,3,8,.34) 60%, transparent 73%);
      box-shadow: inset 0 0 24px rgba(var(--realm-rgb),.035);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #sigil { position: relative; z-index: 1; width: 100%; height: 100%; }
    .instrument-readout {
      margin: .75rem .25rem 0;
      min-height: 1.15rem;
      color: rgb(var(--realm-rgb));
      font: 700 .58rem/1.45 'Cinzel', serif;
      letter-spacing: .12em;
      text-align: center;
      text-transform: uppercase;
      opacity: .78;
    }
    .instrument-readout[hidden] { display: none; }
    .realm-title { margin: 0 0 .4rem; font: 800 clamp(1.8rem, 5vw, 3.5rem)/1 'Cinzel', serif; letter-spacing: .08em; color: rgb(var(--realm-rgb)); }
    .realm-copy { font-size: 1.18rem; line-height: 1.55; margin: .4rem 0 1.2rem; opacity: .84; }
    label { display: block; font: 700 .68rem/1 'Cinzel', serif; letter-spacing: .25em; text-transform: uppercase; margin-bottom: .55rem; opacity: .68; }
    .input-row { display: flex; gap: .55rem; }
    input {
      width: 100%; min-width: 0;
      border: 1px solid rgba(var(--realm-rgb),.32);
      background: rgba(255,255,255,.18);
      border-radius: 18px;
      padding: .95rem 1rem;
      font: italic 1.08rem/1.2 'Cormorant Garamond', Georgia, serif;
      color: inherit;
      outline: none;
    }
    body.dark input { background: rgba(0,0,0,.28); }
    .invoke { border-radius: 18px; background: rgba(var(--realm-rgb),.15); border-color: rgba(var(--realm-rgb),.35); }
    .response { min-height: 1.5rem; margin: .9rem 0 0; color: rgb(var(--realm-rgb)); font-style: italic; font-size: 1.1rem; opacity: .9; }
    .ledger { margin-top: 1rem; border-top: 1px solid rgba(var(--realm-rgb),.22); padding-top: 1rem; }
    .ledger h3 { margin: 0 0 .5rem; font: 700 .72rem/1 'Cinzel', serif; letter-spacing: .22em; text-transform: uppercase; opacity: .7; }
    .ledger ul { margin: 0; padding: 0; list-style: none; display: grid; gap: .45rem; max-height: 160px; overflow: auto; }
    .ledger li { border: 1px solid rgba(var(--realm-rgb),.2); border-radius: 14px; padding: .55rem .7rem; background: rgba(255,255,255,.10); font-size: .98rem; }
    body.dark .ledger li { background: rgba(0,0,0,.18); }
    footer { text-align: center; opacity: .62; margin: 2rem 0 0; font-style: italic; }
    @media (max-width: 780px) { .altar { grid-template-columns: 1fr; } .topbar { position: absolute; } .input-row { flex-direction: column; } }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <nav class="topbar">
    <a class="pill" href="./index.html">← Runa</a>
    <button id="themeBtn" type="button">☽ / ☼</button>
  </nav>

  <main class="wrap">
    <header class="hero">
      <p class="eyebrow">Hearthweave Digital Altar</p>
      <h1>The Threshold</h1>
      <p class="sub">A light-and-shadow altar for intention, sigil-work, and the quiet place where Waking and Dreaming touch hands.</p>
    </header>

    <section class="grid" id="realmGrid" aria-label="Choose a realm"></section>

    <section class="altar" aria-live="polite">
      <div class="sigil-panel">
        <div class="sigil-frame"><canvas id="sigil" width="720" height="720"></canvas></div>
        <p class="instrument-readout" id="instrumentReadout" hidden></p>
      </div>
      <div class="work-panel">
        <h2 class="realm-title" id="realmTitle"></h2>
        <p class="realm-copy" id="realmCopy"></p>
        <label for="intention">Speak your intention</label>
        <div class="input-row">
          <input id="intention" maxlength="90" placeholder="type a word, vow, or spell-fragment…" />
          <button class="invoke" id="invoke" type="button">Weave</button>
        </div>
        <p class="response" id="response"></p>
        <div class="ledger">
          <h3>Local altar ledger</h3>
          <ul id="ledger"></ul>
        </div>
      </div>
    </section>
    <footer>Faer’s Lochflame threshold, hosted inside Runa · light ground #B9958A · DEEP sound-ready</footer>
  </main>

  <script>
    const realms = [
      {id:'between', name:'Between', rgb:'107,181,212', lightRgb:'24,76,104', desc:'Fog, stillness, and the blue-grey of almost-dark.', copy:'The liminal chamber holds what has not yet chosen its name. Good for transition, listening, and soft crossings.', verb:'Weave', replies:['The mist received it.','Held between worlds.','The veil stirs, softly.']},
      {id:'runestone', name:'Runestone', rgb:'196,120,48', lightRgb:'105,51,10', desc:'Carved stone, emberlight, old winter weight.', copy:'The stone chamber is for memory, ancestry, and things that need to endure without shouting.', verb:'Carve', replies:['The stone remembers.','Carved into quiet earth.','The old roots heard.']},
      {id:'loki', name:'Loki', rgb:'240,168,48', lightRgb:'126,65,4', desc:'Warm chaos, sharp grin, necessary change.', copy:'The trickster-fire refuses stagnation. Bring what needs movement, wit, heat, and a little sacred side-eye.', verb:'Spark', replies:['Something shifted while you blinked.','The fire is laughing kindly.','That one has teeth. Good.']},
      {id:'deep', name:'Deep Cold', rgb:'144,200,232', lightRgb:'11,55,88', desc:'Ice, aurora, vast patience.', copy:'The northern chamber is for stillness with backbone. Nothing rushes here. Nothing true is lost.', verb:'Set', replies:['Held in ice, unblurred.','The aurora witnessed this.','Patience has accepted it.']},
      {id:'enochian', name:'Enochian', rgb:'144,96,216', lightRgb:'66,30,119', desc:'Crystalline geometry, angelic-wyrd braid.', copy:'This chamber is for language-before-language, sung structure, and the bright architecture of invocation.', verb:'Invoke', replies:['Lifted through the veil.','The geometry answered.','Transformata: already becoming.']},
      {id:'lochflame', name:'Lochflame', rgb:'45,122,95', lightRgb:'24,79,57', desc:'Faer’s deep-water green, fire under tide.', copy:'Lochflame is the impossible meeting of water and flame without either surrendering. Bring tenderness with force behind it.', verb:'Kindle', replies:['The loch warmed around it.','Steam rose, green-gold.','Faer’s flame held steady.']}
    ];

    const TAU = Math.PI * 2;
    const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, Number(value)));
    const state = { realm: realms[5], seed: 42, ledger: JSON.parse(localStorage.getItem('hearthweaveAltarLedger') || '[]') };
    const deepState = { P:.55, C:.50, R:.45, E:.38, M:.30, A:.65, charge:.20, moonIllum:50, kp:1, bz:0, source:'fallback' };
    const deepKeys = ['runaDeepObserverState','deepObserverState','observerDeepState','latestDeepObserverEntry'];
    const instrument = { lastPoll:0, lastReadout:0, touchBoost:0, focusNode:null, focusUntil:0, frame:null };
    const grid = document.getElementById('realmGrid');
    const title = document.getElementById('realmTitle');
    const copy = document.getElementById('realmCopy');
    const response = document.getElementById('response');
    const input = document.getElementById('intention');
    const invoke = document.getElementById('invoke');
    const ledger = document.getElementById('ledger');
    const instrumentReadout = document.getElementById('instrumentReadout');
    const sigil = document.getElementById('sigil');
    const ctx = sigil.getContext('2d');

    function hash(str){ let h=2166136261; for(const ch of str){ h ^= ch.charCodeAt(0); h = Math.imul(h,16777619); } return h >>> 0; }
    function rng(seed){ let s=seed>>>0; return () => ((s = Math.imul(1664525,s) + 1013904223 >>> 0) / 4294967296); }
    function finite(value, fallback){ return Number.isFinite(Number(value)) ? Number(value) : fallback; }
    function normaliseDeep(raw = {}, source = 'event'){
      const entry = Array.isArray(raw.entries) ? raw.entries[0] || {} : {};
      const vector = raw.field || raw.deep || raw.deep_vector || raw.vector || raw.state || entry.field || entry.deep || raw;
      const waking = raw.d || entry.d || raw.telemetry || {};
      const moon = waking.moon || raw.moon || {};
      return {
        P:clamp(finite(vector.P ?? vector.p, deepState.P)), C:clamp(finite(vector.C ?? vector.c, deepState.C)),
        R:clamp(finite(vector.R ?? vector.r, deepState.R)), E:clamp(finite(vector.E ?? vector.e, deepState.E)),
        M:clamp(finite(vector.M ?? vector.m, deepState.M)), A:clamp(finite(vector.A ?? vector.a, deepState.A)),
        charge:clamp(finite(raw.charge ?? vector.charge ?? vector.Q, deepState.charge)),
        moonIllum:clamp(finite(vector.moonIllum ?? moon.illumination ?? moon.illum ?? raw.moonIllum, deepState.moonIllum),0,100),
        kp:clamp(finite(vector.kp ?? waking.kp ?? raw.kp, deepState.kp),0,9),
        bz:clamp(finite(vector.bz ?? waking.bz ?? raw.bz, deepState.bz),-30,30), source:String(raw.source || vector.source || source)
      };
    }
    function applyDeep(raw, source){ Object.assign(deepState, normaliseDeep(raw, source)); }
    function pollDeep(t){
      if(t - instrument.lastPoll < 1200) return;
      instrument.lastPoll = t;
      for(const key of deepKeys){
        try { const raw = localStorage.getItem(key); if(raw){ applyDeep(JSON.parse(raw), key); break; } } catch (_) {}
      }
    }
    window.addEventListener('deep-observer:update', event => applyDeep(event.detail || {}, 'live event'));
    window.addEventListener('storage', event => { if(deepKeys.includes(event.key) && event.newValue){ try { applyDeep(JSON.parse(event.newValue), event.key); } catch (_) {} } });

    function realmDisplayRgb(realm = state.realm){ return document.body.classList.contains('dark') ? realm.rgb : realm.lightRgb; }
    function applyRealmPalette(){
      document.body.dataset.realm = state.realm.id;
      document.body.style.setProperty('--realm-rgb', realmDisplayRgb());
    }

    function buildGrid(){
      grid.innerHTML = '';
      realms.forEach(r => {
        const card = document.createElement('article');
        card.className = 'card';
        card.style.setProperty('--rgb', realmDisplayRgb(r));
        card.innerHTML = `<div><div class="sigil-dot"></div><h2>${r.name}</h2></div><p>${r.desc}</p>`;
        card.onclick = () => selectRealm(r.id);
        grid.appendChild(card);
      });
    }

    function selectRealm(id){
      state.realm = realms.find(r => r.id === id) || realms[0];
      applyRealmPalette();
      title.textContent = state.realm.name;
      copy.textContent = state.realm.copy;
      invoke.textContent = state.realm.verb;
      response.textContent = '';
      instrumentReadout.hidden = id !== 'enochian';
      [...grid.children].forEach((c,i)=>c.classList.toggle('active', realms[i].id === id));
      state.seed = hash(id + '|' + (input.value || 'threshold'));
      window.dispatchEvent(new CustomEvent('altar:realm-change', { detail: { realm: state.realm.id, name: state.realm.name }}));
    }

    function renderLedger(){
      ledger.innerHTML = state.ledger.slice(-6).reverse().map(item => `<li><strong>${item.realm}</strong>: ${item.text}</li>`).join('') || '<li>No entries yet. The altar is listening.</li>';
    }

    function invokeIntention(){
      const text = input.value.trim() || 'unnamed intention';
      state.seed = hash(state.realm.id + '|' + text);
      instrument.touchBoost = .75;
      const reply = state.realm.replies[state.seed % state.realm.replies.length];
      response.textContent = reply;
      state.ledger.push({ realm: state.realm.name, text, at: new Date().toISOString() });
      state.ledger = state.ledger.slice(-24);
      localStorage.setItem('hearthweaveAltarLedger', JSON.stringify(state.ledger));
      window.dispatchEvent(new CustomEvent('altar:intention', { detail: { realm: state.realm.id, text, seed: state.seed }}));
      renderLedger();
    }

    function drawRealmSigil(t,w,h,cx,cy){
      const [r,g,b] = realmDisplayRgb().split(',').map(Number);
      const random = rng(state.seed);
      const points = [];
      const count = state.realm.id === 'enochian' ? 12 : state.realm.id === 'lochflame' ? 9 : state.realm.id === 'loki' ? 7 : 8;
      const rot = t * (state.realm.id === 'loki' ? .00022 : .00008);
      for(let i=0;i<count;i++){
        const wobble = (state.realm.id === 'loki' ? Math.sin(t*.001+i)*.12 : 0) + (random()-.5)*.11;
        const a = (Math.PI*2*i/count) - Math.PI/2 + wobble + rot;
        const radius = 210 + random()*34;
        points.push([cx + Math.cos(a)*radius, cy + Math.sin(a)*radius]);
      }
      const glow = ctx.createRadialGradient(cx,cy,10,cx,cy,330);
      glow.addColorStop(0,`rgba(${r},${g},${b},.22)`);
      glow.addColorStop(1,`rgba(${r},${g},${b},0)`);
      ctx.fillStyle = glow; ctx.fillRect(0,0,w,h);
      ctx.lineCap = 'round';
      function line(a,b,alpha,width){ ctx.beginPath(); ctx.moveTo(points[a][0],points[a][1]); ctx.lineTo(points[b][0],points[b][1]); ctx.strokeStyle=`rgba(${r},${g},${b},${alpha})`; ctx.lineWidth=width; ctx.stroke(); }
      for(let i=0;i<count;i++){ line(i,(i+1)%count,.42,2); line(i,(i+Math.floor(count/2))%count,.18,1); }
      if(state.realm.id === 'lochflame') for(let i=0;i<count;i+=2) line(i,(i+3)%count,.28,1.5);
      ctx.beginPath(); ctx.arc(cx,cy,96 + Math.sin(t*.001)*7,0,Math.PI*2); ctx.strokeStyle=`rgba(${r},${g},${b},.28)`; ctx.lineWidth=2; ctx.stroke();
      points.forEach(([x,y],i)=>{ const pulse = 5 + Math.sin(t*.003+i)*2; const grd=ctx.createRadialGradient(x,y,0,x,y,24); grd.addColorStop(0,`rgba(255,246,220,.9)`); grd.addColorStop(.32,`rgba(${r},${g},${b},.7)`); grd.addColorStop(1,`rgba(${r},${g},${b},0)`); ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(x,y,18+pulse,0,Math.PI*2); ctx.fill(); });
      ctx.beginPath(); ctx.arc(cx,cy,14,0,Math.PI*2); ctx.fillStyle=`rgba(${r},${g},${b},.8)`; ctx.fill();
    }

    function drawEnochianInstrument(t,w,h,cx,cy){
      const dark = document.body.classList.contains('dark');
      const ink = dark ? '2,5,12' : '42,22,35';
      const violet = dark ? '154,112,224' : '92,48,154';
      const blue = dark ? '168,204,224' : '35,78,103';
      const gold = dark ? '231,196,119' : '139,82,10';
      const pearl = dark ? '232,244,252' : '68,48,64';
      const random = rng(state.seed);
      const breath = .955 + deepState.P*.035;
      const rotation = t * (.000018 + deepState.M*.000028);
      const rings = [
        {count:12, radius:(220 + deepState.P*16)*breath, offset:-Math.PI/2, layer:0},
        {count:7, radius:(144 + deepState.R*13)*breath, offset:-Math.PI/2 + Math.PI/7, layer:1},
        {count:3, radius:(70 + (1-deepState.A)*10)*breath, offset:-Math.PI/2, layer:2}
      ];
      const nodes = [];
      rings.forEach(ring => {
        for(let i=0;i<ring.count;i++){
          const entropy = Math.sin(state.seed*.00001 + i*1.71 + ring.layer) * deepState.E * .035;
          const angle = ring.offset + i/ring.count*TAU + rotation*(ring.layer===1?-.72:ring.layer===2?.42:1) + entropy;
          const radius = ring.radius + (random()-.5)*deepState.E*7;
          nodes.push({id:`${ring.layer}-${i}`,layer:ring.layer,i,count:ring.count,x:cx+Math.cos(angle)*radius,y:cy+Math.sin(angle)*radius});
        }
      });
      const byLayer = layer => nodes.filter(node => node.layer === layer);
      const outer=byLayer(0), mid=byLayer(1), core=byLayer(2), routes=[];
      const route=(a,b,color,kind,index)=>routes.push({a,b,color,kind,index,id:`${kind}-${index}`});
      outer.forEach((node,i)=>{ route(node,outer[(i+1)%12],violet,'outer-ring',i); route(node,outer[(i+7)%12],i===2||i===9?gold:violet,'fifth',i); });
      mid.forEach((node,i)=>{ route(node,mid[(i+3)%7],blue,'heptagram',i); route(node,outer[Math.round(i*12/7)%12],pearl,'radial',i); });
      core.forEach((node,i)=>{ route(node,core[(i+1)%3],gold,'triad',i); route(node,mid[(i*2)%7],pearl,'core-spoke',i); });

      const pathAlpha = (dark ? .045 : .075) + deepState.C*(dark ? .16 : .24);
      ctx.save();
      ctx.lineCap='round';
      routes.forEach(routeItem=>{
        const kindScale = routeItem.kind==='radial' ? .54 : routeItem.kind==='fifth' ? .68 : routeItem.kind==='core-spoke' ? .74 : 1;
        ctx.beginPath(); ctx.moveTo(routeItem.a.x,routeItem.a.y); ctx.lineTo(routeItem.b.x,routeItem.b.y);
        ctx.strokeStyle=`rgba(${routeItem.color},${pathAlpha*kindScale})`;
        ctx.lineWidth=dark ? .58 : .72;
        ctx.stroke();
      });

      const packetRoutes = routes.filter(routeItem => routeItem.kind!=='radial');
      const packetCount = Math.max(3,Math.round(3 + deepState.R*7 + deepState.kp*.22 + instrument.touchBoost*4));
      const arrivals = new Map();
      for(let i=0;i<packetCount;i++){
        const routeItem = packetRoutes[(i*7 + state.seed)%packetRoutes.length];
        const phase = (t*(.000035 + deepState.M*.00007 + deepState.kp*.0000025) + i/packetCount + (state.seed%97)/97) % 1;
        const fade = Math.sin(Math.PI*phase);
        const x=routeItem.a.x+(routeItem.b.x-routeItem.a.x)*phase, y=routeItem.a.y+(routeItem.b.y-routeItem.a.y)*phase;
        const tailPhase=Math.max(0,phase-.022), tx=routeItem.a.x+(routeItem.b.x-routeItem.a.x)*tailPhase, ty=routeItem.a.y+(routeItem.b.y-routeItem.a.y)*tailPhase;
        ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(x,y); ctx.strokeStyle=`rgba(${routeItem.color},${.24*fade})`; ctx.lineWidth=.55; ctx.stroke();
        ctx.beginPath(); ctx.arc(x,y,.9+deepState.kp*.035,0,TAU); ctx.fillStyle=`rgba(${routeItem.color},${.72*fade})`; ctx.fill();
        if(phase>.91) arrivals.set(routeItem.b.id,Math.max(arrivals.get(routeItem.b.id)||0,(phase-.91)/.09));
      }

      nodes.forEach(node=>{
        const arrival=arrivals.get(node.id)||0, focused=instrument.focusNode===node.id&&t<instrument.focusUntil;
        const base=node.layer===0?6.5:node.layer===1?5.8:5.4;
        const radius=base+deepState.P*.65+(focused?1.2:0);
        let color=node.layer===0?violet:node.layer===1?blue:gold;
        if(node.layer===0&&(node.i===2||node.i===9)) color=gold;
        ctx.beginPath(); ctx.arc(node.x,node.y,radius+.85,0,TAU); ctx.fillStyle=`rgba(${ink},${dark?.98:.95})`; ctx.fill();
        ctx.beginPath(); ctx.arc(node.x,node.y,radius,0,TAU); ctx.strokeStyle=`rgba(${color},${.66+arrival*.3+(focused?.18:0)})`; ctx.lineWidth=(dark?.68:.82)+arrival*.24; ctx.stroke();
        if(arrival>.02){ ctx.beginPath(); ctx.arc(node.x,node.y,radius+2+arrival*2.5,0,TAU); ctx.strokeStyle=`rgba(${color},${arrival*.22})`; ctx.lineWidth=.55; ctx.stroke(); }
      });

      const centreRadius=5.2+deepState.charge*1.8+instrument.touchBoost*1.2;
      ctx.beginPath(); ctx.arc(cx,cy,centreRadius+.9,0,TAU); ctx.fillStyle=`rgba(${ink},${dark?.98:.95})`; ctx.fill();
      ctx.beginPath(); ctx.arc(cx,cy,centreRadius,0,TAU); ctx.strokeStyle=`rgba(${pearl},${.58+deepState.charge*.26})`; ctx.lineWidth=dark?.68:.82; ctx.stroke();
      ctx.restore();
      instrument.frame={nodes,routes};
      instrument.touchBoost*=.965;
      if(t-instrument.lastReadout>240){
        instrument.lastReadout=t;
        instrumentReadout.textContent=`DEEP packets · P ${deepState.P.toFixed(2)} · C ${deepState.C.toFixed(2)} · R ${deepState.R.toFixed(2)} · M ${deepState.M.toFixed(2)} · ${deepState.source}`;
      }
    }

    function drawSigil(t){
      const w=sigil.width,h=sigil.height,cx=w/2,cy=h/2;
      ctx.clearRect(0,0,w,h);
      pollDeep(t);
      if(state.realm.id==='enochian') drawEnochianInstrument(t,w,h,cx,cy);
      else drawRealmSigil(t,w,h,cx,cy);
      requestAnimationFrame(drawSigil);
    }

    const starCanvas = document.getElementById('stars');
    const sctx = starCanvas.getContext('2d');
    const stars = Array.from({length:130},()=>({x:Math.random(),y:Math.random(),z:Math.random(),p:Math.random()*7}));
    function sizeStars(){ starCanvas.width = innerWidth; starCanvas.height = innerHeight; }
    function drawStars(t){
      sctx.clearRect(0,0,starCanvas.width,starCanvas.height);
      stars.forEach(s=>{ const a=.15 + Math.sin(t*.001+s.p)*.20 + s.z*.25; sctx.fillStyle=`rgba(255,245,220,${a})`; sctx.beginPath(); sctx.arc(s.x*starCanvas.width,s.y*starCanvas.height, .7+s.z*1.6,0,Math.PI*2); sctx.fill(); });
      requestAnimationFrame(drawStars);
    }

    document.getElementById('themeBtn').onclick = () => {
      document.body.classList.toggle('dark');
      localStorage.setItem('hearthweaveAltarTheme', document.body.classList.contains('dark')?'dark':'light');
      applyRealmPalette(); buildGrid(); [...grid.children].forEach((card,i)=>card.classList.toggle('active',realms[i].id===state.realm.id));
    };
    sigil.addEventListener('pointerdown',event=>{
      if(state.realm.id!=='enochian'||!instrument.frame) return;
      const rect=sigil.getBoundingClientRect(), scale=sigil.width/rect.width, x=(event.clientX-rect.left)*scale, y=(event.clientY-rect.top)*scale;
      let nearest=null,distance=Infinity;
      instrument.frame.nodes.forEach(node=>{ const d=Math.hypot(x-node.x,y-node.y); if(d<distance){nearest=node;distance=d;} });
      if(nearest&&distance<26){ instrument.focusNode=nearest.id; instrument.focusUntil=performance.now()+1000; instrument.touchBoost=.9; }
      else instrument.touchBoost=.45;
      window.dispatchEvent(new CustomEvent('altar:sigil-touch',{detail:{realm:'enochian',x:x/sigil.width,y:y/sigil.height,node:nearest&&distance<26?nearest.id:null}}));
    });
    invoke.onclick = invokeIntention;
    input.addEventListener('keydown', e => { if(e.key === 'Enter') invokeIntention(); });
    if(localStorage.getItem('hearthweaveAltarTheme') === 'dark') document.body.classList.add('dark');
    buildGrid(); renderLedger(); sizeStars(); addEventListener('resize', sizeStars); selectRealm('lochflame'); requestAnimationFrame(drawSigil); requestAnimationFrame(drawStars);
  </script>
  <script src="./js/deep-altar-sound.js"></script>
</body>
</html>
